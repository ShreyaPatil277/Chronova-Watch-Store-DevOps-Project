<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chronova - Premium Watch Store</title>
<style>
  body { font-family: Arial, sans-serif; background: #0d0d0d; color: #f5f5f5; margin: 0; padding: 0; }
  header { background: #1a1a1a; padding: 25px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d4af37; }
  header .logo h1 { color: #d4af37; margin: 0; font-size: 28px; letter-spacing: 2px; }
  header .logo p { color: #aaa; margin: 2px 0 0; font-size: 13px; }
  .cart-link { color: #f5f5f5; text-decoration: none; background: #262626; padding: 10px 18px; border-radius: 6px; border: 1px solid #d4af37; }
  .cart-link:hover { background: #d4af37; color: #000; }
  .grid { display: flex; flex-wrap: wrap; gap: 25px; padding: 40px; justify-content: center; }
  .card { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; width: 260px; padding: 0 0 20px; text-align: center; overflow: hidden; transition: 0.2s; }
  .card:hover { border-color: #d4af37; transform: translateY(-5px); }
  .card img { width: 100%; height: 200px; object-fit: cover; }
  .card .brand { color: #d4af37; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; }
  .card h3 { color: #fff; margin: 6px 0; }
  .card .price { font-size: 22px; color: #f5f5f5; margin: 10px 0 15px; }
  .buy-btn { background: #d4af37; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .buy-btn:hover { background: #e8c96a; }
  footer { text-align: center; padding: 20px; color: #666; font-size: 13px; }
  .toast { position: fixed; bottom: 25px; right: 25px; background: #d4af37; color: #000; padding: 12px 20px; border-radius: 6px; font-weight: bold; display: none; }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <h1>CHRONOVA</h1>
      <p>Premium Watch Store</p>
    </div>
    <a class="cart-link" href="/cart">🛒 Cart (<span id="cart-count">0</span>)</a>
  </header>

  <div class="grid">
    {% for watch in watches %}
    <div class="card">
      <img src="{{ watch.image }}" alt="{{ watch.name }}">
      <div class="brand">{{ watch.brand }}</div>
      <h3>{{ watch.name }}</h3>
      <div class="price">₹{{ "{:,.0f}".format(watch.price) }}</div>
      <button class="buy-btn" onclick="addToCart({{ watch.id }}, '{{ watch.name }}', '{{ watch.brand }}', {{ watch.price }}, '{{ watch.image }}')">Add to Cart</button>
    </div>
    {% endfor %}
  </div>

  <footer>Chronova Watch Store — DevOps Demo Project</footer>
  <div class="toast" id="toast">Added to cart!</div>

<script>
function getCart() {
  return JSON.parse(localStorage.getItem("chronova_cart") || "[]");
}
function saveCart(cart) {
  localStorage.setItem("chronova_cart", JSON.stringify(cart));
}
function updateCartCount() {
  const cart = getCart();
  const count = cart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById("cart-count").innerText = count;
}
function addToCart(id, name, brand, price, image) {
  let cart = getCart();
  const existing = cart.find(item => item.id === id);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ id, name, brand, price, image, qty: 1 });
  }
  saveCart(cart);
  updateCartCount();
  const toast = document.getElementById("toast");
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 1500);
}
updateCartCount();
</script>
</body>
</html>
